<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduManage | Request Access</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f7fb;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: white;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      color: #2563eb;
      margin-bottom: 8px;
    }

    .logo p {
      color: #64748b;
      font-size: 14px;
    }

    h2 {
      margin-bottom: 8px;
      color: #1e293b;
    }

    .description {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
      color: #334155;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      <h1>EduManage</h1>
      <p>School Management System</p>
    </div>

    <h2>Request Access</h2>

    <p class="description">
      New to EduManage? Submit your details below. Your request will be
      reviewed by the school administrator before you receive access.
    </p>

    <form id="requestForm">

      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input
          type="text"
          id="fullName"
          placeholder="Enter your full name"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input
          type="tel"
          id="phone"
          placeholder="Enter your phone number"
          required
        >
      </div>

      <div class="form-group">
        <label for="role">Account Type</label>

        <select id="role" required>
          <option value="">Select account type</option>
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
          <option value="parent">Parent</option>
        </select>
      </div>

      <button type="submit" id="submitButton">
        Request Access
      </button>

    </form>

    <div id="message" class="message"></div>

    <a href="login.html" class="back">
      ← Back to Login
    </a>

  </div>

  <script>
    const SUPABASE_URL =
      "https://hakyydcvakiqisutknjn.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_nyfPuNJKYFJ3DmH10oBafQ_qIXrRgzg";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("requestForm");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const fullName =
        document.getElementById("fullName").value.trim();

      const email =
        document.getElementById("email").value.trim().toLowerCase();

      const phone =
        document.getElementById("phone").value.trim();

      const role =
        document.getElementById("role").value;

      message.className = "message";
      message.textContent = "";

      if (!fullName || !email || !phone || !role) {
        message.className = "message error";
        message.textContent =
          "Please complete all fields.";
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Submitting...";

      try {

        const { error } = await supabaseClient
          .from("access_requests")
          .insert({
            full_name: fullName,
            email: email,
            phone: phone,
            requested_role: role,
            status: "pending"
          });

        if (error) {
          console.error(error);

          message.className = "message error";
          message.textContent =
            "Unable to submit your request. Please try again.";

          submitButton.disabled = false;
          submitButton.textContent = "Request Access";

          return;
        }

        message.className = "message success";

        message.textContent =
          "Your request has been submitted successfully. " +
          "Please wait for the school administrator to approve your account.";

        form.reset();

      } catch (error) {

        console.error(error);

        message.className = "message error";
        message.textContent =
          "Something went wrong. Please try again.";

      }

      submitButton.disabled = false;
      submitButton.textContent = "Request Access";
    });
  </script>

</body>
</html>
