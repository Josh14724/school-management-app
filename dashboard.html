<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduManage | Dashboard</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7f8;
      color: #1c302a;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    /* SIDEBAR */

    .sidebar {
      width: 250px;
      background: #173f35;
      color: white;
      padding: 25px 15px;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      overflow-y: auto;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      padding: 0 15px;
      margin-bottom: 40px;
    }

    .logo span {
      color: #8dd6b5;
    }

    .menu-title {
      font-size: 11px;
      color: #9db8ae;
      margin: 20px 15px 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 13px 15px;
      margin: 5px 0;
      border-radius: 9px;
      color: #d7e6e1;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
    }

    .nav-item:hover,
    .nav-item.active {
      background: #2d6857;
      color: white;
    }

    .nav-icon {
      width: 22px;
      text-align: center;
      font-size: 17px;
    }

    /* MAIN */

    .main {
      margin-left: 250px;
      width: calc(100% - 250px);
    }

    .topbar {
      height: 80px;
      background: white;
      border-bottom: 1px solid #e6ece9;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 35px;
    }

    .page-title h1 {
      font-size: 23px;
    }

    .page-title p {
      font-size: 13px;
      color: #84908c;
      margin-top: 4px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }
